; F´ project settings (consumed by fprime-util / fprime-gds).
; Polaris keeps the framework submodule at top-level ./fprime (design doc §22.3),
; overriding the fprime-bootstrap default of ./lib/fprime — Polaris's lib/ is its
; own shared C++ library, so the framework must not nest inside it.
[fprime]
project_root:   .
framework_path: ./fprime

; Skip building F´ framework/autocoder unit tests in the project build (we run our
; own GoogleTest suite); flip on only when debugging the framework itself.
default_cmake_options:  FPRIME_ENABLE_FRAMEWORK_UTS=OFF
                        FPRIME_ENABLE_AUTOCODER_UTS=OFF
