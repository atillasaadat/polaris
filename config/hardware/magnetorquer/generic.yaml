# Generic magnetorquer rod (design doc §19.2 hardware library). Representative
# values; refine against the unit spec. Keys match the C++
# MagnetorquerSpec::fromParams (sim/actuators/magnetorquer.cpp); in-code twin is
# catalog::genericMagnetorquer(). Copy this to add a COTS rod.
model_id: MTQ-GENERIC
kind: magnetorquer
description: Generic magnetorquer rod (template — refine from a datasheet)
params:
  max_dipole_am2: 15.0          # rated magnetic moment [A·m²]
  residual_dipole_am2: 0.05     # remanent moment = hysteresis half-width [A·m²].
                                # Well under 1% of the rating, which is what COTS
                                # rods quote after degaussing (NewSpace NCTR-M012:
                                # <0.005 on 0.12). It matters more than it looks:
                                # the remanence is a permanent near-field on the
                                # body-mounted magnetometers (§7), so a
                                # pessimistic value here shows up as a permanent
                                # magnetic signature the §8.2 plausibility band
                                # and the §9 stuck-on monitor both have to live
                                # above. The earlier 0.5 was a placeholder.
  linearity: 0.03               # scale-factor error, fractional
  power_max_w: 1.0              # power at full dipole [W]
  # Field-settling time after the drive is removed [s] (design doc §7). This is
  # what sizes the MTQ/MAG interlock's quiet window, so it is derived rather than
  # guessed: the rod's field decays as the coil current does, with time constant
  # L/R. A smallsat rod of this class is ~10^3 turns on a ferrite core — order
  # 0.1-1 H of inductance against 10-100 ohm of winding plus drive resistance,
  # i.e. L/R of a few milliseconds — and the core's own relaxation is well under
  # that. 10 ms is a conservative representative of the 5-20 ms band COTS rods
  # sit in, and the model treats it as the time by which ~95% of the transient
  # is gone (tau = settle_time_s/3). Refine from the unit's measured decay.
  settle_time_s: 0.01
