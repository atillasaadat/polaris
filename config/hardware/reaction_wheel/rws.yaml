# Generic smallsat-class reaction wheel "RW-S" (design doc §19.2). Representative
# 12-25 kg-class values; refine against the unit spec. Keys match the C++
# ReactionWheelSpec::fromParams (sim/actuators/reaction_wheel.cpp).
#
# WHY THIS ENTRY EXISTS. The catalog's other generic wheel, RW-X, stores
# 0.5 N·m·s — a ~150 kg-class unit. `analysis/sizing` measured it at **78x** the
# largest sizing driver on the 12 kg reference bus: one RW-X could spin the whole
# vehicle to 239 deg/s, and the vehicle desaturated at 12 rpm of a 6000 rpm
# rotor. The obvious repair — grow the spacecraft to suit the wheel — was tried
# and failed for a reason worth recording here, because it is the constraint that
# picked this part:
#
#   B-dot rails its rods for the whole detumble, so its *effective* gain is not
#   the commanded k but m_sat|B|/omega, which falls as the vehicle spins faster.
#   Avanzini & Giulietti's convergence floor then caps the rate the law can
#   remove at all: omega_max = eta·m·|B|_min·duty / (2·w_o·(1+sin xi)·J_min).
#   With the catalog's 15 A·m² rods that is 15.3 deg/s at J_min = 0.10 kg·m²
#   (the 5 deg/s tip-off sits well inside) but only 0.37 deg/s at J_min = 4.08 —
#   below the 1.71 deg/s the magnetometer can even resolve. A 50 kg bus has no
#   convergent detumble operating point with these rods.
#
# So the rods fix the vehicle at the small end, and the wheel is the part that
# was wrong. 30 mN·m·s sits inside the [8.3, 64] mN·m·s window the sizing tool
# derives for this bus (above the 5 deg/s tip-off with 30 % margin, below the
# 10x oversizing gate) and matches real parts in the class — CubeSpace CW0.03,
# Sinclair RW-0.03. Re-run `python -m analysis.sizing` after any change here.
model_id: RW-S
kind: reaction_wheel
description: Generic smallsat reaction wheel, 30 mN·m·s class
params:
  max_torque_nm: 0.002           # peak output torque [N·m]
  max_momentum_nms: 0.030        # momentum storage at max speed [N·m·s]
  max_speed_rpm: 6000.0          # maximum wheel speed [rpm]
  motor_kt_nm_a: 0.008           # torque constant (I = τ/Kt) [N·m/A]
  motor_resistance_ohm: 4.0      # winding resistance (copper loss) [Ω]
  dry_friction_nm: 0.000008      # Coulomb friction torque [N·m]
  viscous_friction_nm_s: 0.0000004  # viscous friction ∝ speed [N·m/(rad/s)]
  aero_friction_nm_s2: 0.0         # aero friction ∝ speed² [N·m/(rad/s)²]
  torque_quantization_nm: 0.000008 # drive torque LSB [N·m]
  static_imbalance_kg_m: 0.0       # Us [kg·m] — radial force = Us·ω² (jitter)
  dynamic_imbalance_kg_m2: 0.0     # Ud [kg·m²] — radial torque = Ud·ω² (jitter)
  idle_power_w: 0.15               # housekeeping power draw [W]
