# Generic smallsat reaction wheel "RW-X" (design doc §19.2). Representative
# 12-25 kg-class values (CubeSpace CW0.03 / Sinclair RW-0.03 class); refine
# against the unit spec. Keys match ReactionWheelSpec::fromParams
# (sim/actuators/reaction_wheel.cpp); the in-code twin is
# catalog::genericReactionWheel(). Sized for the reference vehicle by
# `analysis/sizing` (Push 60) — re-run it after any change here.
model_id: RW-X
kind: reaction_wheel
description: Generic smallsat reaction wheel, 30 mN·m·s class
params:
  max_torque_nm: 0.002           # peak output torque [N·m]
  max_momentum_nms: 0.030        # momentum storage at max speed [N·m·s]
  max_speed_rpm: 6000.0          # maximum wheel speed [rpm]
  motor_kt_nm_a: 0.008           # torque constant (I = τ/Kt) [N·m/A]
  motor_resistance_ohm: 4.0      # winding resistance (copper loss) [Ω]
  dry_friction_nm: 0.000008      # Coulomb friction torque [N·m]
  viscous_friction_nm_s: 0.0000004  # viscous friction ∝ speed [N·m/(rad/s)]
  aero_friction_nm_s2: 0.0         # aero friction ∝ speed² [N·m/(rad/s)²]
  stiction_nm: 0.000016            # breakaway torque, 2x Coulomb (representative; unit calibration)
  stiction_band_rad_s: 0.5         # Karnopp band, ~5 rpm: below it the rotor is "at rest"
  torque_quantization_nm: 0.000008 # drive torque LSB [N·m]
  static_imbalance_kg_m: 0.0       # Us [kg·m] — radial force = Us·ω² (jitter)
  dynamic_imbalance_kg_m2: 0.0     # Ud [kg·m²] — radial torque = Ud·ω² (jitter)
  idle_power_w: 0.15               # housekeeping power draw [W]
