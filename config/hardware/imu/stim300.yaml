# Sensonor STIM300 tactical-grade IMU (design doc §19.2 hardware-model library).
# Params are representative datasheet-class values; refine against the unit's
# calibration report before flight. SI-ish engineering units as noted per key.
model_id: STIM300
kind: imu
description: Sensonor STIM300 tactical-grade MEMS IMU (gyro-focused for ADCS)
params:
  gyro_arw_deg_sqrt_hr: 0.15        # angular random walk [deg/sqrt(hr)]
  gyro_bias_instability_deg_hr: 0.3 # in-run bias stability [deg/hr]
  gyro_range_deg_s: 400.0           # measurement range [deg/s]
  accel_vrw_m_s_sqrt_hr: 0.06       # velocity random walk [m/s/sqrt(hr)]
  sample_rate_hz: 250.0             # output data rate [Hz]
