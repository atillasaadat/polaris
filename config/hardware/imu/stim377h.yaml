# Safran/Sensonor STIM377H tactical-grade IMU (design doc §19.2 hardware library).
#
# Values transcribed from the STIM377H product brief, Ed. 2022-04, in the
# datasheet's own engineering units. The C++ truth model reads these same keys via
# ImuSpec::fromParams (sim/sensors/imu.cpp), which converts them to SI; the
# authoritative in-code copy is catalog::stim377h(). `*_bias_correlation_s` is a
# modelling choice (Gauss-Markov in-run correlation time), not a datasheet field.
model_id: STIM377H
kind: imu
description: Safran/Sensonor STIM377H tactical-grade MEMS IMU (AOCS-grade)
params:
  # --- Gyros ---
  gyro_range_deg_s: 480.0               # output cap (±400 °/s input range)
  gyro_arw_deg_sqrt_hr: 0.15            # angular random walk
  gyro_bias_instability_deg_hr: 0.3     # in-run bias instability
  gyro_bias_correlation_s: 100.0        # GM correlation time (modelling choice)
  gyro_bias_repeatability_deg_hr: 10.0  # bias error over temp gradients, rms
  gyro_scale_factor_ppm: 500.0          # scale-factor accuracy
  gyro_misalignment_mrad: 1.0           # electronic axis alignment
  gyro_resolution_deg_hr: 0.22          # resolution
  gyro_g_sensitivity_deg_hr_g: 7.0      # linear-acceleration bias effect (no g-comp)
  # --- Accelerometers ---
  accel_range_g: 10.0                   # standard input range
  accel_vrw_m_s_sqrt_hr: 0.07           # velocity random walk
  accel_bias_instability_mg: 0.04       # bias instability
  accel_bias_correlation_s: 100.0       # GM correlation time (modelling choice)
  accel_bias_repeatability_mg: 2.0      # bias error over temp gradients, rms
  accel_scale_factor_ppm: 200.0         # scale-factor accuracy
  accel_misalignment_mrad: 1.0          # electronic axis alignment
  accel_resolution_ug: 1.9              # resolution
  # --- Common ---
  sample_rate_hz: 2000.0                # max sample rate
