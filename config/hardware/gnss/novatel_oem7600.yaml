# NovAtel OEM7600 multi-frequency GNSS receiver (design doc §19.2).
#
# Source: https://hexagondownloads.blob.core.windows.net/public/Novatel/assets/
#   Documents/Papers/OEM7600-Product-Sheet/OEM7600-Product-Sheet.pdf
# (Hexagon | NovAtel OEM7600 Product Sheet). A compact multi-constellation,
# multi-frequency receiver. It reports a processed PVT solution (ECEF position
# and velocity in GPS time), so this entry configures the fix-accuracy path, not
# pseudoranges — the same keys as the C++ GnssSpec::fromParams (sim/sensors/gnss.cpp).
#
# The figures below are the *unaided single-point* accuracy — no SBAS/DGPS/RTK/
# TerraStar corrections — because that is the honest baseline for a LEO spacecraft
# with no differential link. The datasheet also lists SBAS 60 cm, DGPS 40 cm,
# TerraStar-C PRO 2 cm and RTK 1 cm; a mission with a correction service can drop
# horizontal_position_rms_m to the corresponding figure.
model_id: NOVATEL-OEM7600
kind: gnss
description: NovAtel OEM7600 multi-frequency GNSS receiver (single-point PVT)
params:
  # --- Position accuracy (datasheet "Horizontal position accuracy (RMS)") -------
  # Single point L1/L2 = 1.2 m 2D-RMS. GnssSpec divides by sqrt(2) for the
  # per-axis sigma. Vertical is not quoted; the model defaults it to 1.5x the
  # horizontal per-axis sigma (typical VDOP/HDOP), overridable here.
  horizontal_position_rms_m: 1.2
  # vertical_position_rms_m:  # omitted -> model uses 1.5x horizontal per-axis

  # --- Error spectrum: how much of that RMS is common-mode (Push 77) ------------
  # The datasheet quotes a magnitude and says nothing about the spectrum, so this
  # split is an ENGINEERING ALLOCATION in the same sense as the magnetic
  # cleanliness allocation (design doc §8.5) — not a datasheet figure, and
  # labelled as one so nobody mistakes it for measured.
  #
  # The basis: on an unaided single-point solution the residual error is
  # dominated by broadcast ephemeris + satellite clock (the signal-in-space
  # range error) and, on a single-frequency receiver, residual ionosphere. Those
  # are common to the satellites in view and decorrelate over minutes to the
  # ephemeris update interval, not per fix. This is a multi-frequency receiver,
  # so the ionospheric part is largely removed and what remains is chiefly
  # SISRE — hence half the variance, on a 10 minute timescale, rather than the
  # larger fraction a single-frequency entry would carry.
  #
  # The split PRESERVES the datasheet total: sigma_white = sigma*sqrt(1-f) and
  # sigma_corr = sigma*sqrt(f), and the receiver still reports the full 1.2 m.
  # It changes the COLOUR of the error, not its size — which is precisely what
  # the onboard filter is unprepared for, and what
  # flight.orbitEstimator.GnssCorrSigma{H,V}M is tuned against.
  correlated_position_fraction: 0.5   # allocation, not datasheet
  correlated_position_tau_s: 600.0    # allocation: ~10 min, SISRE-dominated

  # --- Velocity and time (datasheet) --------------------------------------------
  velocity_accuracy_m_s_rms: 0.03   # "Velocity accuracy < 0.03 m/s RMS"
  time_accuracy_ns_rms: 5.0         # "Time accuracy < 5 ns RMS"

  # --- Rate (datasheet "Maximum data rate: Position up to 100 Hz") --------------
  max_rate_hz: 100.0

  # --- Fix latency --------------------------------------------------------------
  # Interval between the epoch a solution is valid at and the epoch it reaches the
  # FSW. The datasheet quotes "Measurement latency 20 ms" for OEM7 position
  # logging; 0.05 s carries that plus bus transport and one scheduler slot.
  # This is not a small term: at 7.6 km/s it is 380 m of along-track position, and
  # it is what lib/gnc/orbit_od.hpp's latency correction exists to remove. The
  # flight-side bound (OrbitOdConfig::max_fix_latency_s) must cover it.
  fix_latency_s: 0.05
  # Delivery jitter on that latency, 1-sigma per fix. Bus and scheduler do not
  # deliver every message the same milliseconds late (15 +/- 7.5 ms measured on
  # CubeSat buses, Ceresoli et al. 2025); the fix's time tag is unaffected, so
  # the flight latency correction stays exact — this exists to prove that.
  fix_latency_jitter_s: 0.005

  # --- Acquisition / reacquisition (datasheet) ----------------------------------
  cold_start_s: 34.0     # "Time to first fix: Cold start < 34 s (typ)"
  hot_start_s: 20.0      # "Hot start < 20 s (typ)" — informational
  reacquisition_s: 0.5   # "Signal reacquisition: L1 < 0.5 s (typ)"
