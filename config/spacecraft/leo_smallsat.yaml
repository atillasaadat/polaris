# Reference LEO smallsat — template config (design doc §19.1, §19.2).
#
# A ready 6U-class test vehicle: IMU + star tracker, a pyramidal reaction-wheel
# set, in a 500 km sun-synchronous orbit. Hardware is referenced by model-ID
# (resolved against config/hardware/ by the config compiler); swap a model_id
# string to re-fly the same vehicle with a different unit (REQ-CFG-002).
#
# Compile:
#   PYTHONPATH=tools uv run python -m configc \
#     --config config/spacecraft/leo_smallsat.yaml \
#     --hardware config/hardware --out build/config

spacecraft:
  name: LEO-Smallsat-Ref
  mass_kg: 12.0
  com_m: [0.0, 0.0, 0.0]            # body frame [m]
  inertia_kgm2:                     # body frame [kg·m²]
    ixx: 0.12
    iyy: 0.12
    izz: 0.10
  sensors:
    # Two IMUs, identically mounted (no mounting_quaternion_wxyz -> identity).
    # Two rather than three is a mass/cost decision (user, 2026-08-02), and it
    # decides which branch of the §8.2 vote this vehicle actually flies. Three
    # units give a **median**, which tolerates one arbitrary fault without
    # knowing which unit is at fault. Two units cannot: a pair can *detect* a
    # disagreement and never attribute it on its own, so identification needs a
    # third information source — the MEKF's propagated body rate, with the unit
    # the filter's own dynamics disbelieve losing. When no filter solution is
    # available the disagreement stays unattributed and the vehicle publishes no
    # rate, holding attitude on a growing covariance (§9.2 conservative
    # response), which is the cost of the second unit rather than the third.
    # Averaging them is forbidden either way — one railed unit drags the mean
    # without limit (lib/gnc/imu_voting.hpp).
    - name: imu_a
      model_id: STIM300
    - name: imu_b
      model_id: STIM300
    - name: st_a
      model_id: ST-16
    # --- Sun-sensor suite: six units on the six faces (§8.2) ----------------
    # Sun sensor + magnetometer = coarse attitude (§8.1), and the sun pair is the
    # primary TRIAD vector — so losing the Sun from every field of view costs the
    # attitude, not just accuracy. One unit on a single face buys that loss over
    # three quarters of the sky.
    #
    # COVERAGE MATH. The FSS has a 60 deg acceptance half-angle, so one unit sees
    # the solid-angle fraction (1 - cos 60 deg)/2 = 0.25 of the sphere. Six cones
    # on the six face normals cover it **completely**: the worst-placed direction
    # is a body diagonal, at arccos(1/sqrt(3)) = 54.736 deg from each of the three
    # nearest face normals, which is inside the 60 deg cone. So there is no
    # attitude at which the vehicle cannot see the Sun.
    #
    # TWO SEPARATE FACTS, and conflating them would mis-derive the budget.
    # 54.736 deg is the worst-case *best-available* unit — pure layout geometry.
    # It is NOT a bound on what the vehicle actually reads: the flight selector
    # orders on reported sigma with ties to the lowest index, and sigma is a
    # two-regime step (0.5 deg inside 45, 2.0 deg to the edge), so under a tie it
    # takes the lowest-indexed unit in view rather than the best-aimed one —
    # anywhere out to the 60 deg edge. The shipped SigmaSunWhiteRad is the EDGE
    # figure, which is what bounds every geometry the suite can produce, and the
    # handoff sweep in tests/unit/attitude_accuracy_mc_test.cpp models the flight
    # selector exactly rather than an idealised best-incidence one.
    # Measured over 4e6 uniform directions: mean best-unit incidence 31.9 deg,
    # 87.9% of directions inside the 45 deg inner-accuracy regime, 47.3% seen by
    # two or more units; worst selected incidence 60.0 deg.
    #
    # Dropping one face (the +-X/+-Y/+Z pattern) would leave 8.8% of the sphere —
    # a region about -Z — seen by nothing, so the sixth unit is what makes the
    # coverage statement unconditional rather than attitude-dependent.
    #
    # WHY SIX OF THE SAME PART. Six fine sun sensors on a 6U is a deliberate
    # simplification, not a cost-optimised suite: a real vehicle would fly one FSS
    # on the array normal and five coarse photodiode cells (config/hardware/
    # sun_sensor/coarse_generic.yaml) on the rest. Those parts report **diode
    # counts**, and the FSW has no onboard counts->vector reconstruction yet
    # (§8.2 names it; it is not implemented). Flying one part type keeps the FSW
    # path single and the coverage math clean until that lands.
    #
    # MOUNTING. The sensor boresight is unit +Z always, and
    # mounting_quaternion_wxyz is the unit->body rotation, so each entry below is
    # the quaternion that carries +Z onto that face normal. ss_zp keeps identity
    # and index 0: it is the **solar-array normal**, the face the vehicle points
    # at the Sun in Sun-Point and Safe (§10), so it is the unit in view in the
    # nominal attitude and the one the accuracy budget was measured on.
    - name: ss_zp                     # boresight body +Z  (solar-array normal)
      model_id: GS-NANOSENSE-FSS
    - name: ss_zm                     # boresight body -Z  (180 deg about X)
      model_id: GS-NANOSENSE-FSS
      mounting_quaternion_wxyz: [0.0, 1.0, 0.0, 0.0]
    - name: ss_xp                     # boresight body +X  (-90 deg about Y)
      model_id: GS-NANOSENSE-FSS
      mounting_quaternion_wxyz: [0.7071067811865476, 0.0, -0.7071067811865476, 0.0]
    - name: ss_xm                     # boresight body -X  (+90 deg about Y)
      model_id: GS-NANOSENSE-FSS
      mounting_quaternion_wxyz: [0.7071067811865476, 0.0, 0.7071067811865476, 0.0]
    - name: ss_yp                     # boresight body +Y  (+90 deg about X)
      model_id: GS-NANOSENSE-FSS
      mounting_quaternion_wxyz: [0.7071067811865476, 0.7071067811865476, 0.0, 0.0]
    - name: ss_ym                     # boresight body -Y  (-90 deg about X)
      model_id: GS-NANOSENSE-FSS
      mounting_quaternion_wxyz: [0.7071067811865476, -0.7071067811865476, 0.0, 0.0]
    - name: mag_a
      model_id: MAG-GENERIC
    - name: gps_a                     # GNSS PVT fix -> onboard OD (§8.3)
      model_id: NOVATEL-OEM7600
    - name: imager_a                  # payload: boresight geometry only (§6.3)
      model_id: PAYLOAD-IMAGER-GENERIC
      # Boresight is sensor +Z, always; this quaternion is the whole pointing
      # definition. Identity mounts it along body +Z, so the payload looks where
      # the vehicle's +Z axis does — nadir in the nominal Earth-pointing attitude.
      # The cross-boresight knowledge requirement REQ-PAY-001 is stated about
      # this axis.
      mounting_quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
  actuators:                        # pyramidal 4-wheel set: spin axes = body
    - name: rw_1                    # diagonals [±1,±1,1]/√3, so any 3 wheels give
      model_id: RW-X                # 3-axis control (§7 W-matrix assembly)
      spin_axis: [0.57735, 0.57735, 0.57735]
    - name: rw_2
      model_id: RW-X
      spin_axis: [-0.57735, 0.57735, 0.57735]
    - name: rw_3
      model_id: RW-X
      spin_axis: [-0.57735, -0.57735, 0.57735]
    - name: rw_4
      model_id: RW-X
      spin_axis: [0.57735, -0.57735, 0.57735]
    - name: mtq_x                   # 3-axis torque rod set (detumble + desaturation)
      model_id: MTQ-GENERIC
    - name: mtq_y
      model_id: MTQ-GENERIC
    - name: mtq_z
      model_id: MTQ-GENERIC
  gains:
    detumble:
      k_bdot: 10000.0                # B-dot gain
    pointing:
      kp: 0.2                        # proportional (attitude)
      kd: 0.8                        # derivative (rate)
  # FSW tuning delivered to the F´ ParameterDb (design doc §19.3). Keys are the
  # fully-qualified parameter names in the generated topology dictionary; the
  # config compiler resolves each to its generated ID and writes PrmDb.dat, and
  # fails if a name is unknown or a declared parameter is left unset. There are
  # deliberately no flight defaults: a component with a missing parameter refuses
  # to run rather than inventing one.
  #
  # The attitude estimator's noise budget below — coarse chain and MEKF fine mode
  # alike — is *derived from the units this vehicle actually carries*: the
  # GomSpace NanoSense FSS, the generic magnetometer and the STIM300 above, not
  # chosen to make the estimator look good. Re-derive these whenever a model_id
  # changes.
  fsw_parameters:
    # Sun pair. The FSS is specified 2.0 deg 3-sigma out at the 60 deg field
    # edge (0.5 deg inside 45 deg), so 2.0/3 deg = 11.6 mrad is the conservative
    # white part.
    #
    # The systematic part is **composed per cycle** from two independent terms
    # rather than shipped as one number:
    #
    #     sigma_sun_sys = hypot(albedo term, ephemeris term)
    #
    # They are separated because they fail independently and are fixed
    # independently — the albedo term is the sensor's and moves when the sun
    # sensor or its correction changes; the ephemeris term is the *reference's*
    # and moves when the onboard tables are uploaded or expire. Two of the four
    # values below are in force on any given cycle.
    #
    # ALBEDO TERM. GomSpace warn that uncorrected albedo "can generate errors
    # >10 deg", with an ISS-orbit histogram whose bulk sits under 2 deg and whose
    # tail runs past 10 deg. It is budgeted as systematic rather than white
    # because it is a function of the sunlit-Earth geometry in the field of view,
    # which changes over minutes of orbit, not cycle to cycle — repeated fixes at
    # 10 Hz do not average it away. 2.0 deg = 34.9 mrad is the histogram bulk,
    # not the tail: budgeting the 12 deg peak would make the sun pair worthless
    # as the primary TRIAD vector, and the tail is a transient the coarse chain
    # rides out on the gyro. That figure is SigmaSunAlbedoUncorrRad, what this
    # vehicle flew at before §8.1's correction landed.
    #
    # Corrected, the deterministic part is removed and what remains is the
    # dispersion — how far the real Earth departs from the uniform Lambertian
    # sphere the correction models it as — which the FSS catalog entry puts at
    # 30% of the term (albedo_dispersion_fraction; read the comment there, it is
    # the number this line turns on). 0.30 * 34.9 = 10.5 mrad.
    #
    # The estimator picks between the two per cycle, on whether the correction
    # actually ran (it needs a position fix, a sunlit Earth in the field, and an
    # attitude to place it with), and telemeters SunAlbedoCorrection so the
    # ground can see which was in force. NOT folded into either constant: the
    # correction's own sensitivity to the attitude that placed the Earth, which
    # is A*sigma_att/2 with A the 12 deg peak (it scales with the peak, not with
    # the applied correction — the rotation axis is what an attitude error
    # moves). That depends on how well the attitude is known *this cycle*, so it
    # is added in quadrature at runtime. At a converged fine solution (~0.6 deg)
    # it is ~1 mrad; right after acquisition it dominates, which is why it is
    # dynamic rather than budgeted.
    #
    # EPHEMERIS TERM. The analytic sun ephemeris fallback (§11.3) is good to
    # ~0.4 deg = 7.0 mrad — SigmaSunEphemRad, the degraded floor this vehicle
    # flies on with no ephemeris upload or past the end of the uploaded span.
    # With the onboard DE440 Chebyshev tables answering (grade PRECISE) the sun
    # direction is arcsecond-class, and what is left is geometry rather than fit
    # error: at r = 6878 km the geocentric-to-spacecraft-centric parallax is at
    # most asin(r / 1 AU) = 4.598e-5 rad, against a Chebyshev residual of ~3.5e-12
    # rad — seven orders below, so it rounds away. 5e-5 covers the parallax with
    # 9% margin. Re-derive if the orbit changes: the parallax scales with r.
    # The component subtracts that parallax itself when it has both a position
    # fix and the ECEF->ECI rotation, so this budgets the case where either is
    # missing. Deliberately a parameter
    # rather than an assumed zero — what an uploaded table is worth is the
    # ground's statement, not the code's assumption.
    #
    # Which one is in force is not a configuration choice: it follows the grade
    # the ephemeris query answers at, per cycle. Watch OnboardTables.EphemGrade,
    # and the estimator's ReferenceDegraded/ReferenceRecovered events on the
    # EPHEMERIS domain, to see it move.
    #
    # WHAT THE FOUR COMPOSE TO on this vehicle:
    #   corrected + tables    hypot(10.5, 0.05) = 10.5 mrad  (nominal)
    #   corrected + analytic  hypot(10.5, 7.0)  = 12.6 mrad
    #   uncorrected + tables  hypot(34.9, 0.05) = 34.9 mrad
    #   uncorrected + analytic hypot(34.9, 7.0) = 35.6 mrad  (worst case)
    # With the tables active the ephemeris term stops mattering entirely and the
    # sun budget is the albedo dispersion alone — which makes that dispersion,
    # once again, the thing worth improving next.
    #
    # The datasheet quotes no installed mounting alignment, so none is added.
    flight.attitudeEstimator.SigmaSunWhiteRad: 0.0116          # [rad]
    flight.attitudeEstimator.SigmaSunAlbedoRad: 0.0105         # [rad] correction ran
    flight.attitudeEstimator.SigmaSunAlbedoUncorrRad: 0.0349   # [rad] correction unavailable
    flight.attitudeEstimator.SigmaSunEphemRad: 0.0070          # [rad] analytic fallback
    flight.attitudeEstimator.SigmaSunEphemPreciseRad: 5.0e-5   # [rad] DE440 tables active
    # Magnetic pair. MAG-GENERIC noise is 0.05 uT rms against a ~30 uT LEO
    # field, so the transverse direction error is 0.05/30 = 1.7 mrad white. The
    # systematic part is dominated by the uncalibrated hard-iron bias (1.0 uT /
    # 30 uT = 33 mrad) with 5 mrad of soft-iron/non-orthogonality in quadrature:
    # sqrt(33.3^2 + 5^2) = 33.7 mrad. This is why the magnetometer is the
    # secondary TRIAD vector and the sun the primary.
    flight.attitudeEstimator.SigmaMagWhiteRad: 0.0017     # [rad]
    flight.attitudeEstimator.SigmaMagSysRad: 0.0337       # [rad]
    # STIM300 angle random walk, 0.15 deg/sqrt(hr) converted to SI:
    # 0.15 * (pi/180) / 60 = 4.363e-5 rad/sqrt(s).
    flight.attitudeEstimator.GyroArw: 4.363e-5            # [rad·s^(-1/2)]
    # TRIAD geometry gate: 0.17 ~= sin(10 deg). Below this the sun and field
    # directions are close enough to parallel that roll about the sun is
    # unobservable and the solve is refused rather than reported as a fix.
    flight.attitudeEstimator.MinSinAngle: 0.17            # [-]
    # Complementary blend gain: 0.3 pulls ~30% of the TRIAD-vs-propagated error
    # in per fix, so the solution follows the gyro between fixes and converges
    # over ~1 s at 10 Hz — fast enough for the Safe-mode floor without passing
    # the magnetometer's 34 mrad systematic straight through to the output.
    flight.attitudeEstimator.TriadGain: 0.3               # [-]
    # Coast horizon: the longest eclipse in this 500 km SSO is ~35.6 min, so
    # 2400 s covers a full umbra pass with margin. Riding the gyro that long
    # costs 4.363e-5 * sqrt(2400) = 2.1 mrad of random walk, small against the
    # 34 mrad magnetic floor — the coast is limited by bias drift, not ARW.
    flight.attitudeEstimator.MaxCoastSec: 2400.0          # [s]
    # Largest propagation step: 0.5 s is five 10 Hz frames. A longer gap is a
    # dropout, and the attitude is held rather than extrapolated on a stale rate.
    flight.attitudeEstimator.MaxDtSec: 0.5                # [s]
    # Staleness window (§9.1): 1.0 s admits the slowest sensor on this vehicle
    # while excluding anything a full second behind the cycle epoch.
    flight.attitudeEstimator.MaxMeasAgeSec: 1.0           # [s]
    # Geocentric radius band a GNSS fix must fall in to be used as the point the
    # geomagnetic reference is evaluated at (§9.1). 6.5e6 m is below this orbit
    # but above the Earth's surface; 5.0e7 m is well past any orbit this vehicle
    # can reach, so both ends catch a corrupt fix without gating a real one.
    flight.attitudeEstimator.MinPositionRadiusM: 6.5e6    # [m]
    flight.attitudeEstimator.MaxPositionRadiusM: 5.0e7    # [m]
    # --- Fine mode (MEKF) -------------------------------------------------
    # The filter's angle random walk is GyroArw above and its largest
    # propagation step is MaxDtSec: same gyro, same rate group, so they are not
    # duplicated here.
    #
    # Rate random walk sigma_u, from the STIM300 bias instability. The datasheet
    # 0.3 deg/hr is an Allan-deviation floor; for a first-order Gauss-Markov
    # process that floor is ~0.437 of the steady-state sigma, so
    # sigma_GM = (0.3 * pi/180 / 3600) / 0.437 = 3.33e-6 rad/s. Converting to the
    # equivalent random walk over the modelled 100 s correlation time,
    # sigma_u = sigma_GM * sqrt(2/tau) = 3.33e-6 * 0.1414 = 4.7e-7. That grows
    # the bias uncertainty by ~1 deg/hr over 100 s, the right order against the
    # 10 deg/hr turn-on repeatability below.
    flight.attitudeEstimator.MekfRrw: 4.7e-7              # [rad·s^(-3/2)]
    # NIS gate: chi-square, 2 degrees of freedom (the innovation between two unit
    # vectors is transverse, so the third component carries no variance), at
    # 99.9% = 13.82. One rejection in a thousand good measurements is the price
    # of a guard that stops an outlier dragging the reference attitude.
    flight.attitudeEstimator.MekfNisGate: 13.82           # [-]
    # Fine coast horizon: 300 s without an accepted update. Much shorter than the
    # coarse 2400 s, and deliberately so — the two horizons answer different
    # questions. Eclipse alone does not trigger it (the magnetic pair still
    # updates the filter in shadow); it takes losing *both* vector sources, e.g.
    # eclipse plus a GNSS outage, which is a fault, and after five minutes of it
    # the always-available floor is the honest product.
    flight.attitudeEstimator.MekfMaxCoastSec: 300.0       # [s]
    # Initial gyro-bias 1-sigma: the STIM300 bias repeatability over temperature,
    # 10 deg/hr = 10 * (pi/180) / 3600 = 4.848e-5 rad/s. The seed bias itself is
    # zero, so this is the whole of what the filter is told at cold start.
    flight.attitudeEstimator.MekfBiasSigmaInit: 4.848e-5  # [rad/s]
    # Demotion streaks at the 10 Hz GNC rate. Five refused cycles (0.5 s) is a
    # filter that cannot take input at all — not something to wait out. Twenty
    # consecutive NIS rejections (2 s) is a measurement stream the filter has
    # disbelieved without interruption; below that, a burst is the chi-square
    # tail plus the odd albedo transient, which is exactly what the gate is for.
    flight.attitudeEstimator.MekfRefusalStreak: 5         # [cycles]
    flight.attitudeEstimator.MekfNisStreak: 20            # [cycles]
    # Davenport seed observability gate, lambda_min/lambda_max of the information
    # matrix. Set to match the coarse chain's MinSinAngle = sin(10 deg): two
    # equally-weighted observations separated by theta give
    # (1 - cos theta)/2 = sin^2(theta/2), so 10 deg of separation is
    # sin^2(5 deg) = 0.0076. The same geometry that refuses a TRIAD refuses a
    # seed. (sin^2(theta)/2 is the easy mistake here — it agrees at 90 deg and
    # is nearly double at small separations, which would gate at ~14 deg.)
    flight.attitudeEstimator.SeedMinObservability: 0.0076 # [-]
    # --- Commanded magnetometer calibration (§8.1) ------------------------
    # Gates on the onboard hard/soft-iron ellipsoid fit MAG_CAL_START runs.
    # Read at MAG_CAL_START only: a missing value here refuses the *command*
    # (MagCalRejected CONFIG) and costs the vehicle nothing else.
    #
    # NOTE (ops): the values below tune the *fit*. A successful calibration
    # invalidates two other entries in this file — SigmaMagWhiteRad and
    # SigmaMagSysRad describe an uncalibrated magnetometer (the 33.7 mrad
    # systematic above is almost entirely the hard iron this fit removes), and
    # SeedMinObservability was derived from the *ratio* of the sun and magnetic
    # sigmas, so a much tighter magnetic pair makes 0.0076 refuse every geometry
    # in the band. THE POST-FIT UPLINK SET, and how each value is derived:
    #
    #   SigmaMagSysRad:       ~1.5e-3   [rad]  the fitted residual, graded from
    #                                          MagCalResidualAngle telemetry
    #                                          (0.087 deg measured on this budget)
    #   SigmaMagWhiteRad:     0.0017    [rad]  unchanged — the fit removes the
    #                                          systematic, not the sensor noise
    #   SeedMinObservability: 5.1e-4    [-]    re-derived below
    #
    # THE OBSERVABILITY GATE, DERIVED. The gate is lambda_min/lambda_max of the
    # information matrix M = w_s (I - s s') + w_m (I - m m'), w = 1/sigma^2. That
    # ratio is scale-free under a *common* rescaling of the sigmas — which is what
    # makes it a geometry gate — but not under changing them relative to each
    # other. Splitting M into the out-of-plane direction (eigenvalue w_s + w_m)
    # and the 2x2 in-plane block (trace w_s + w_m, determinant w_s w_m sin^2 th)
    # gives the closed form
    #
    #   lambda_min/lambda_max = [1 - sqrt(1 - 4 w_s w_m sin^2(th) / (w_s+w_m)^2)]/2
    #
    # which collapses to sin^2(th/2) at equal weights — the shipped 0.0076 at
    # th = 10 deg. Post-fit the weights are not equal. With the albedo correction
    # also in force (it is a model, always on, and needs no uplink) the sun total
    # is hypot(0.0116, 0.0126) = 0.01713 on the analytic ephemeris and
    # hypot(0.0116, 0.0105) = 0.01565 with the DE440 tables, against a magnetic
    # total of hypot(0.0017, 0.0015) = 0.00228. The same 10 deg then reads
    # 5.16e-4 (analytic) and 6.14e-4 (tables). **5.1e-4** is the value to uplink:
    # the ephemeris grade changes per cycle without an uplink, so the gate must
    # admit 10 deg in the worse of the two, and being slightly loose in the other
    # (it admits down to 9.1 deg there) errs toward accepting a geometry the
    # coarse chain's own MinSinAngle = sin(10 deg) is still publishing at.
    #
    # An earlier note here said ~1.1e-4. That figure is the same formula on the
    # *uncalibrated* sun budget (0.0356 systematic, the "~16x tighter magnetic
    # pair" reading) — a parameter set the vehicle never flies, because a vehicle
    # with a calibrated magnetometer also has the albedo correction running. It
    # would gate at 4.6 deg rather than 10 deg, i.e. seed the filter on geometry
    # the coarse chain has already refused to solve.
    #
    # Re-derive and uplink all three after a good fit; see
    # flight/PolarisFsw/README.md.
    #
    # Preconditioner for the ten-parameter fit: the IGRF magnitude at this 500 km
    # SSO runs ~22-52 uT over an orbit, so 30 uT is the mid-scale value. Numerics
    # only — the solution is invariant to it up to round-off.
    flight.attitudeEstimator.MagCalNominalFieldT: 30.0e-6  # [T]
    # Acceptance band on both |m_raw| and the IGRF magnitude. 10 uT is below any
    # field this orbit sees, so it catches a dead or unpowered sensor; 80 uT is
    # above any field it sees and below the MAG-GENERIC 100 uT range, so it
    # catches a saturated reading and (until the §7 MTQ/MAG interlock supplies
    # the actuation state) the grossest magnetorquer-contaminated samples.
    flight.attitudeEstimator.MagCalMinFieldT: 10.0e-6      # [T]
    flight.attitudeEstimator.MagCalMaxFieldT: 80.0e-6      # [T]
    # Ten unknowns fit exactly at ten samples and report zero residual whatever
    # the truth, so the residual and condition gates only mean something on a
    # well-overdetermined problem. 100 is ten-times overdetermined and 10 s of a
    # 10 Hz window; the measured 0.087 deg residual was taken at 200.
    flight.attitudeEstimator.MagCalMinSamples: 100         # [samples]
    # Orientation coverage 3*lambda_min(D) of the sampled field directions. For
    # directions spread over a cone of half-angle alpha the metric is
    # (3/2)*<sin^2 theta>: 0.09 at 20 deg, 0.32 at 40 deg, 0.40 at 45 deg. 0.35
    # sits between 40 and 45 deg — wide enough that the fitted ellipsoid is not
    # extrapolated far past the data, narrow enough to be reachable in a
    # detumble-rate tumble rather than requiring a commanded full-sky scan.
    flight.attitudeEstimator.MagCalMinCoverage: 0.35       # [-]
    # Condition ceiling on the *normal* matrix. Streaming forces the normal
    # equations (the design matrix is never held), so the conditioning is squared
    # relative to a QR of the rows: 1e6 here is a well-covered 1e3 in the rows,
    # which still leaves ~10 digits of the double mantissa. The stage-1 unit
    # tests measure ~1e3-1e4 on accepted windows and blow past 1e6 on the
    # narrow-cone windows this is meant to refuse.
    flight.attitudeEstimator.MagCalMaxCondition: 1.0e6     # [-]
    # The fitted residual must beat the uncalibrated one by 2x. On the reference
    # budget the real improvement is ~22x, so this only ever fires on a window
    # that learned nothing — and refusing there is the point: a calibration that
    # makes the magnetometer worse is the outcome guarded hardest against.
    flight.attitudeEstimator.MagCalMinImprovement: 2.0     # [-]
    # --- Multi-IMU voting (§8.2, §9.2) -------------------------------------
    # This vehicle's TWO STIM300s are combined by pairwise disagreement detection
    # with the MEKF's propagated rate identifying the offender — never by an
    # average (lib/gnc/imu_voting.hpp). Two units is the NOMINAL configuration
    # here, not a degraded one: the median branch the library also implements
    # engages at three or more, which this vehicle does not carry.
    #
    # Physical rate limit. Not the gyro's measurement range — that is what a
    # railed unit reports — but the fastest this vehicle can credibly be turning:
    # a launch-vehicle separation tip-off of a few deg/s, with an order of
    # magnitude of margin. 30 deg/s = 0.5236 rad/s. A reading above it is a failed
    # unit, and on this 12 kg vehicle with 1.4 mNm of magnetorquer authority it is
    # a rate no fault of the actuators can produce either.
    flight.attitudeEstimator.ImuMaxRateRadps: 0.5236       # [rad/s]
    # Pairwise disagreement gate — on this vehicle the gate that decides every
    # comparison, since two units is the whole suite.
    # The STIM300 pair's combined 1-sigma is dominated by bias repeatability
    # (10 deg/hr each, so ~0.004 deg/s on the difference) plus ARW; 0.5 deg/s =
    # 8.7e-3 rad/s sits two orders above that, so it fires on faults and not on
    # tails. Set high deliberately: a false disagreement costs the body rate for
    # that cycle, since two units cannot say which of them is wrong.
    flight.attitudeEstimator.ImuDisagreementRadps: 0.0087  # [rad/s]
    # Consecutive cycles passing THE CRITERION THAT EXCLUDED IT that re-admit a
    # unit: 10 = 1 s at the 10 Hz GNC rate. Automatic re-admission (rather than
    # command-only) because the dominant real cause of one implausible sample is
    # transient, and spending a unit of redundancy permanently on a bus glitch is
    # the more expensive error; the consecutive count is the hysteresis that stops
    # a marginal unit flapping. A genuinely dead unit never accumulates it.
    #
    # "The criterion that excluded it" is load-bearing: a unit excluded by
    # IDENTIFICATION was plausible by construction, so it earns credit only on
    # cycles where it agrees with the combination. Counting plausibility for it
    # would re-admit it unconditionally and it would be outvoted again next
    # cycle — a permanent flap at this period, one FDIR event per lap.
    flight.attitudeEstimator.ImuReadmitCycles: 10          # [cycles]
    # Consecutive cycles the same unit must lose the identification before it is
    # latched out: 5 = 0.5 s at 10 Hz. A latch is permanent until re-admission
    # earns it back, so one sample must not buy one — and under a slow
    # common-mode drift the residual ordering can flip cycle to cycle, which is
    # precisely the case a single-sample latch would get wrong. 0.5 s is long
    # enough that a verdict has to be consistent rather than lucky, and short
    # enough to be invisible against the 300 s fine coast horizon. It costs
    # detection latency, not rate availability: the winning unit is published
    # throughout the window.
    flight.attitudeEstimator.ImuIdentifyConfirmCycles: 5   # [cycles]
    # Continuous-ambiguity horizon, and the cadence the escalation repeats at:
    # 600 = 60 s at 10 Hz. An unattributable disagreement leaves the vehicle with
    # no body rate, and the per-condition alert is edge-gated — right for a
    # transient, wrong for a permanent fault, which would otherwise be one
    # warning and then silence. A minute is long enough that a passing
    # disagreement never escalates and short enough that a real one is on the
    # ground's console within a pass.
    flight.attitudeEstimator.ImuAmbiguityEscalateCycles: 600  # [cycles]
    # --- Earth-albedo correction of the sun vector (§8.1) ------------------
    # Not a commanded calibration: a model, always on wherever the geometry
    # supports it. The peak and the field of view describe the GS-NANOSENSE-FSS
    # part, which every sun sensor on this vehicle is, so they are one value each;
    # the boresights are per unit. Re-derive if that model_id changes.
    #
    # 12 deg peak albedo error, from the catalog entry's albedo_error_deg:
    # 12 * pi/180 = 0.2094 rad.
    flight.attitudeEstimator.SunAlbedoPeakRad: 0.20944     # [rad]
    # 60 deg acceptance half-angle, from half_fov_deg: 60 * pi/180 = 1.0472.
    flight.attitudeEstimator.SunAlbedoHalfFovRad: 1.04720  # [rad]
    # Per-unit boresights, body frame, **in sunSensorIn port-array order** — which
    # is the order the sun sensors are declared above (§19.4 build order). Eight
    # slots (flight.GncMaxUnits), three components each, flat: F´ has no
    # array-of-array parameter the config compiler encodes, and eight separately
    # named parameters would be eight chances for them to disagree about which
    # vector they describe.
    #
    # A slot for a unit that is not installed is written as the **zero vector**,
    # which the estimator reads as "no correction for this index" and takes the
    # uncorrected sun sigma on. That is the honest default: the correction places
    # the Earth in *this* unit's field, so a wrong boresight silently scales the
    # correction rather than failing, and skipping is strictly better than
    # guessing (§8.1).
    #
    # These must match the mounting_quaternion_wxyz entries above — each is that
    # quaternion applied to the sensor's +Z.
    flight.attitudeEstimator.SunAlbedoBoresightsBody: [
       0.0,  0.0,  1.0,    # 0: ss_zp  (+Z, solar-array normal)
       0.0,  0.0, -1.0,    # 1: ss_zm  (-Z)
       1.0,  0.0,  0.0,    # 2: ss_xp  (+X)
      -1.0,  0.0,  0.0,    # 3: ss_xm  (-X)
       0.0,  1.0,  0.0,    # 4: ss_yp  (+Y)
       0.0, -1.0,  0.0,    # 5: ss_ym  (-Y)
       0.0,  0.0,  0.0,    # 6: not installed
       0.0,  0.0,  0.0]    # 7: not installed
  drag_area_m2: 0.06                 # 6U broadside, ~0.2 x 0.3 m
  drag_cd: 2.2
  srp_area_m2: 0.06
  srp_cr: 1.3
  # No-default fields (§5.3): the disturbance-torque lever arms. A zero here has
  # to be written down as a deliberate "perfectly balanced", never defaulted.
  cp_offset_aero_m: [0.01, 0.0, 0.0]   # aero CoP 1 cm off the CoM (ram face)
  cp_offset_srp_m: [0.012, 0.0, 0.0]   # optical CoP: illuminated area, not ram
  residual_dipole_am2: [0.002, -0.001, 0.0015]

scenario:
  name: leo-sso-500km
  epoch_utc: "2026-01-01T00:00:00Z"
  seed: 20260101                    # master RNG seed; run is reproducible from {config, seed}
  initial_state:
    orbit:                            # 500 km circular sun-synchronous
      sma_km: 6878.137                # 6378.137 + 500
      ecc: 0.0
      inc_deg: 97.4018                # SSO: nodal precession = 360°/tropical year
      raan_deg: 0.0
      argp_deg: 0.0
      true_anomaly_deg: 0.0
    attitude_quaternion: [1.0, 0.0, 0.0, 0.0]   # scalar-first, body←ECI identity
    body_rate_rad_s: [0.001, -0.002, 0.0015]    # small tumble to exercise attitude
  propagation:
    duration_s: 5677.0                # one orbit period at this altitude
    output_step_s: 10.0
    abs_tol: 1.0e-12
    rel_tol: 1.0e-12
    max_step_s: 60.0
  environment:
    gravity_degree: 8
    drag_enabled: true
    srp_enabled: true
    third_bodies: [sun, moon]     # options: sun, moon, mercury, venus, mars, jupiter, saturn, uranus, neptune
                                  # (case-insensitive; planets are DE440 barycenters, ~1e-7 of the lunar term in LEO)
    atmosphere: exponential
    magnetic_field: igrf
    eclipse_enabled: true
    occultation_atmosphere_km: 100.0  # optical limb height for sensor occlusion (§6.1)
    gnss_jamming_kml: config/scenarios/jamming/eastern_europe.kml  # GNSS loss-of-fix zones (§9.2)
    gnss_jamming_enabled: true        # master switch for the jamming map above
    gnss_noise_enabled: true          # false = truth-perfect GPS (bring-up/debug)
    gnss_fault_events:                # scheduled GNSS faults (§9.2/§23.1.1)
      - {unit: gps_a, type: outage, start_s: 600.0, stop_s: 660.0}
      - {unit: gps_a, type: spoof, start_s: 1200.0, stop_s: 1260.0, spoof_offset_ecef_m: [500.0, 0.0, 0.0]}
  ground_stations:
    - name: svalbard
      lat_deg: 78.23
      lon_deg: 15.39
      alt_m: 450.0
    - name: fairbanks
      lat_deg: 64.86
      lon_deg: -147.85
      alt_m: 130.0
  mc_dispersions:
    - param: spacecraft.mass_kg
      distribution: normal
      sigma: 0.2
    - param: spacecraft.inertia_kgm2.izz
      distribution: normal
      sigma: 0.005
