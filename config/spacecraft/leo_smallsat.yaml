# Reference LEO smallsat — template config (design doc §19.1, §19.2).
#
# A ready 6U-class test vehicle: IMU + star tracker, a pyramidal reaction-wheel
# set, in a 500 km sun-synchronous orbit. Hardware is referenced by model-ID
# (resolved against config/hardware/ by the config compiler); swap a model_id
# string to re-fly the same vehicle with a different unit (REQ-CFG-002).
#
# Compile:
#   PYTHONPATH=tools uv run python -m configc \
#     --config config/spacecraft/leo_smallsat.yaml \
#     --hardware config/hardware --out build/config

spacecraft:
  name: LEO-Smallsat-Ref
  mass_kg: 12.0
  com_m: [0.0, 0.0, 0.0]            # body frame [m]
  inertia_kgm2:                     # body frame [kg·m²]
    ixx: 0.12
    iyy: 0.12
    izz: 0.10
  sensors:
    - name: imu_a
      model_id: STIM300
    - name: st_a
      model_id: ST-16
    - name: ss_zp                     # sun sensor + magnetometer = coarse attitude (§8.1)
      model_id: GS-NANOSENSE-FSS
    - name: mag_a
      model_id: MAG-GENERIC
    - name: gps_a                     # GNSS PVT fix -> onboard OD (§8.3)
      model_id: NOVATEL-OEM7600
    - name: imager_a                  # payload: boresight geometry only (§6.3)
      model_id: PAYLOAD-IMAGER-GENERIC
      # Boresight is sensor +Z, always; this quaternion is the whole pointing
      # definition. Identity mounts it along body +Z, so the payload looks where
      # the vehicle's +Z axis does — nadir in the nominal Earth-pointing attitude.
      # The cross-boresight knowledge requirement REQ-PAY-001 is stated about
      # this axis.
      mounting_quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
  actuators:                        # pyramidal 4-wheel set: spin axes = body
    - name: rw_1                    # diagonals [±1,±1,1]/√3, so any 3 wheels give
      model_id: RW-X                # 3-axis control (§7 W-matrix assembly)
      spin_axis: [0.57735, 0.57735, 0.57735]
    - name: rw_2
      model_id: RW-X
      spin_axis: [-0.57735, 0.57735, 0.57735]
    - name: rw_3
      model_id: RW-X
      spin_axis: [-0.57735, -0.57735, 0.57735]
    - name: rw_4
      model_id: RW-X
      spin_axis: [0.57735, -0.57735, 0.57735]
    - name: mtq_x                   # 3-axis torque rod set (detumble + desaturation)
      model_id: MTQ-GENERIC
    - name: mtq_y
      model_id: MTQ-GENERIC
    - name: mtq_z
      model_id: MTQ-GENERIC
  gains:
    detumble:
      k_bdot: 10000.0                # B-dot gain
    pointing:
      kp: 0.2                        # proportional (attitude)
      kd: 0.8                        # derivative (rate)
  # FSW tuning delivered to the F´ ParameterDb (design doc §19.3). Keys are the
  # fully-qualified parameter names in the generated topology dictionary; the
  # config compiler resolves each to its generated ID and writes PrmDb.dat, and
  # fails if a name is unknown or a declared parameter is left unset. There are
  # deliberately no flight defaults: a component with a missing parameter refuses
  # to run rather than inventing one.
  #
  # The attitude estimator's noise budget below — coarse chain and MEKF fine mode
  # alike — is *derived from the units this vehicle actually carries*: the
  # GomSpace NanoSense FSS, the generic magnetometer and the STIM300 above, not
  # chosen to make the estimator look good. Re-derive these whenever a model_id
  # changes.
  fsw_parameters:
    # Sun pair. The FSS is specified 2.0 deg 3-sigma out at the 60 deg field
    # edge (0.5 deg inside 45 deg), so 2.0/3 deg = 11.6 mrad is the conservative
    # white part.
    #
    # The systematic part has two contributors, and **albedo dominates**. The
    # analytic sun ephemeris fallback (§11.3) is good to ~0.4 deg = 7.0 mrad.
    # Earthshine is far larger: GomSpace warn that uncorrected albedo "can
    # generate errors >10 deg", with an ISS-orbit histogram whose bulk sits
    # under 2 deg and whose tail runs past 10 deg. It is budgeted here as
    # systematic rather than white because it is a function of the sunlit-Earth
    # geometry in the field of view, which changes over minutes of orbit, not
    # cycle to cycle — repeated fixes at 10 Hz do not average it away. 2.0 deg
    # = 34.9 mrad is the histogram bulk, not the tail: budgeting the 12 deg
    # peak would make the sun pair worthless as the primary TRIAD vector, and
    # the tail is a transient the coarse chain rides out on the gyro. RSS with
    # the ephemeris term: sqrt(7.0^2 + 34.9^2) = 35.6 mrad.
    #
    # The datasheet quotes no installed mounting alignment, so none is added.
    flight.attitudeEstimator.SigmaSunWhiteRad: 0.0116     # [rad]
    flight.attitudeEstimator.SigmaSunSysRad: 0.0356       # [rad]
    # Magnetic pair. MAG-GENERIC noise is 0.05 uT rms against a ~30 uT LEO
    # field, so the transverse direction error is 0.05/30 = 1.7 mrad white. The
    # systematic part is dominated by the uncalibrated hard-iron bias (1.0 uT /
    # 30 uT = 33 mrad) with 5 mrad of soft-iron/non-orthogonality in quadrature:
    # sqrt(33.3^2 + 5^2) = 33.7 mrad. This is why the magnetometer is the
    # secondary TRIAD vector and the sun the primary.
    flight.attitudeEstimator.SigmaMagWhiteRad: 0.0017     # [rad]
    flight.attitudeEstimator.SigmaMagSysRad: 0.0337       # [rad]
    # STIM300 angle random walk, 0.15 deg/sqrt(hr) converted to SI:
    # 0.15 * (pi/180) / 60 = 4.363e-5 rad/sqrt(s).
    flight.attitudeEstimator.GyroArw: 4.363e-5            # [rad·s^(-1/2)]
    # TRIAD geometry gate: 0.17 ~= sin(10 deg). Below this the sun and field
    # directions are close enough to parallel that roll about the sun is
    # unobservable and the solve is refused rather than reported as a fix.
    flight.attitudeEstimator.MinSinAngle: 0.17            # [-]
    # Complementary blend gain: 0.3 pulls ~30% of the TRIAD-vs-propagated error
    # in per fix, so the solution follows the gyro between fixes and converges
    # over ~1 s at 10 Hz — fast enough for the Safe-mode floor without passing
    # the magnetometer's 34 mrad systematic straight through to the output.
    flight.attitudeEstimator.TriadGain: 0.3               # [-]
    # Coast horizon: the longest eclipse in this 500 km SSO is ~35.6 min, so
    # 2400 s covers a full umbra pass with margin. Riding the gyro that long
    # costs 4.363e-5 * sqrt(2400) = 2.1 mrad of random walk, small against the
    # 34 mrad magnetic floor — the coast is limited by bias drift, not ARW.
    flight.attitudeEstimator.MaxCoastSec: 2400.0          # [s]
    # Largest propagation step: 0.5 s is five 10 Hz frames. A longer gap is a
    # dropout, and the attitude is held rather than extrapolated on a stale rate.
    flight.attitudeEstimator.MaxDtSec: 0.5                # [s]
    # Staleness window (§9.1): 1.0 s admits the slowest sensor on this vehicle
    # while excluding anything a full second behind the cycle epoch.
    flight.attitudeEstimator.MaxMeasAgeSec: 1.0           # [s]
    # Geocentric radius band a GNSS fix must fall in to be used as the point the
    # geomagnetic reference is evaluated at (§9.1). 6.5e6 m is below this orbit
    # but above the Earth's surface; 5.0e7 m is well past any orbit this vehicle
    # can reach, so both ends catch a corrupt fix without gating a real one.
    flight.attitudeEstimator.MinPositionRadiusM: 6.5e6    # [m]
    flight.attitudeEstimator.MaxPositionRadiusM: 5.0e7    # [m]
    # --- Fine mode (MEKF) -------------------------------------------------
    # The filter's angle random walk is GyroArw above and its largest
    # propagation step is MaxDtSec: same gyro, same rate group, so they are not
    # duplicated here.
    #
    # Rate random walk sigma_u, from the STIM300 bias instability. The datasheet
    # 0.3 deg/hr is an Allan-deviation floor; for a first-order Gauss-Markov
    # process that floor is ~0.437 of the steady-state sigma, so
    # sigma_GM = (0.3 * pi/180 / 3600) / 0.437 = 3.33e-6 rad/s. Converting to the
    # equivalent random walk over the modelled 100 s correlation time,
    # sigma_u = sigma_GM * sqrt(2/tau) = 3.33e-6 * 0.1414 = 4.7e-7. That grows
    # the bias uncertainty by ~1 deg/hr over 100 s, the right order against the
    # 10 deg/hr turn-on repeatability below.
    flight.attitudeEstimator.MekfRrw: 4.7e-7              # [rad·s^(-3/2)]
    # NIS gate: chi-square, 2 degrees of freedom (the innovation between two unit
    # vectors is transverse, so the third component carries no variance), at
    # 99.9% = 13.82. One rejection in a thousand good measurements is the price
    # of a guard that stops an outlier dragging the reference attitude.
    flight.attitudeEstimator.MekfNisGate: 13.82           # [-]
    # Fine coast horizon: 300 s without an accepted update. Much shorter than the
    # coarse 2400 s, and deliberately so — the two horizons answer different
    # questions. Eclipse alone does not trigger it (the magnetic pair still
    # updates the filter in shadow); it takes losing *both* vector sources, e.g.
    # eclipse plus a GNSS outage, which is a fault, and after five minutes of it
    # the always-available floor is the honest product.
    flight.attitudeEstimator.MekfMaxCoastSec: 300.0       # [s]
    # Initial gyro-bias 1-sigma: the STIM300 bias repeatability over temperature,
    # 10 deg/hr = 10 * (pi/180) / 3600 = 4.848e-5 rad/s. The seed bias itself is
    # zero, so this is the whole of what the filter is told at cold start.
    flight.attitudeEstimator.MekfBiasSigmaInit: 4.848e-5  # [rad/s]
    # Demotion streaks at the 10 Hz GNC rate. Five refused cycles (0.5 s) is a
    # filter that cannot take input at all — not something to wait out. Twenty
    # consecutive NIS rejections (2 s) is a measurement stream the filter has
    # disbelieved without interruption; below that, a burst is the chi-square
    # tail plus the odd albedo transient, which is exactly what the gate is for.
    flight.attitudeEstimator.MekfRefusalStreak: 5         # [cycles]
    flight.attitudeEstimator.MekfNisStreak: 20            # [cycles]
    # Davenport seed observability gate, lambda_min/lambda_max of the information
    # matrix. Set to match the coarse chain's MinSinAngle = sin(10 deg): two
    # equally-weighted observations separated by theta give
    # (1 - cos theta)/2 = sin^2(theta/2), so 10 deg of separation is
    # sin^2(5 deg) = 0.0076. The same geometry that refuses a TRIAD refuses a
    # seed. (sin^2(theta)/2 is the easy mistake here — it agrees at 90 deg and
    # is nearly double at small separations, which would gate at ~14 deg.)
    flight.attitudeEstimator.SeedMinObservability: 0.0076 # [-]
    # --- Commanded magnetometer calibration (§8.1) ------------------------
    # Gates on the onboard hard/soft-iron ellipsoid fit MAG_CAL_START runs.
    # Read at MAG_CAL_START only: a missing value here refuses the *command*
    # (MagCalRejected CONFIG) and costs the vehicle nothing else.
    #
    # NOTE (ops): the values below tune the *fit*. A successful calibration
    # invalidates two other entries in this file — SigmaMagWhiteRad and
    # SigmaMagSysRad describe an uncalibrated magnetometer (the 33.7 mrad
    # systematic above is almost entirely the hard iron this fit removes), and
    # SeedMinObservability was derived from the *ratio* of the sun and magnetic
    # sigmas, so a ~16x tighter magnetic pair makes 0.0076 refuse every geometry
    # in the band (~1.1e-4 preserves its 10 deg meaning). Re-derive and uplink
    # all three after a good fit; see flight/PolarisFsw/README.md.
    #
    # Preconditioner for the ten-parameter fit: the IGRF magnitude at this 500 km
    # SSO runs ~22-52 uT over an orbit, so 30 uT is the mid-scale value. Numerics
    # only — the solution is invariant to it up to round-off.
    flight.attitudeEstimator.MagCalNominalFieldT: 30.0e-6  # [T]
    # Acceptance band on both |m_raw| and the IGRF magnitude. 10 uT is below any
    # field this orbit sees, so it catches a dead or unpowered sensor; 80 uT is
    # above any field it sees and below the MAG-GENERIC 100 uT range, so it
    # catches a saturated reading and (until the §7 MTQ/MAG interlock supplies
    # the actuation state) the grossest magnetorquer-contaminated samples.
    flight.attitudeEstimator.MagCalMinFieldT: 10.0e-6      # [T]
    flight.attitudeEstimator.MagCalMaxFieldT: 80.0e-6      # [T]
    # Ten unknowns fit exactly at ten samples and report zero residual whatever
    # the truth, so the residual and condition gates only mean something on a
    # well-overdetermined problem. 100 is ten-times overdetermined and 10 s of a
    # 10 Hz window; the measured 0.087 deg residual was taken at 200.
    flight.attitudeEstimator.MagCalMinSamples: 100         # [samples]
    # Orientation coverage 3*lambda_min(D) of the sampled field directions. For
    # directions spread over a cone of half-angle alpha the metric is
    # (3/2)*<sin^2 theta>: 0.09 at 20 deg, 0.32 at 40 deg, 0.40 at 45 deg. 0.35
    # sits between 40 and 45 deg — wide enough that the fitted ellipsoid is not
    # extrapolated far past the data, narrow enough to be reachable in a
    # detumble-rate tumble rather than requiring a commanded full-sky scan.
    flight.attitudeEstimator.MagCalMinCoverage: 0.35       # [-]
    # Condition ceiling on the *normal* matrix. Streaming forces the normal
    # equations (the design matrix is never held), so the conditioning is squared
    # relative to a QR of the rows: 1e6 here is a well-covered 1e3 in the rows,
    # which still leaves ~10 digits of the double mantissa. The stage-1 unit
    # tests measure ~1e3-1e4 on accepted windows and blow past 1e6 on the
    # narrow-cone windows this is meant to refuse.
    flight.attitudeEstimator.MagCalMaxCondition: 1.0e6     # [-]
    # The fitted residual must beat the uncalibrated one by 2x. On the reference
    # budget the real improvement is ~22x, so this only ever fires on a window
    # that learned nothing — and refusing there is the point: a calibration that
    # makes the magnetometer worse is the outcome guarded hardest against.
    flight.attitudeEstimator.MagCalMinImprovement: 2.0     # [-]
  drag_area_m2: 0.06                 # 6U broadside, ~0.2 x 0.3 m
  drag_cd: 2.2
  srp_area_m2: 0.06
  srp_cr: 1.3
  # No-default fields (§5.3): the disturbance-torque lever arms. A zero here has
  # to be written down as a deliberate "perfectly balanced", never defaulted.
  cp_offset_aero_m: [0.01, 0.0, 0.0]   # aero CoP 1 cm off the CoM (ram face)
  cp_offset_srp_m: [0.012, 0.0, 0.0]   # optical CoP: illuminated area, not ram
  residual_dipole_am2: [0.002, -0.001, 0.0015]

scenario:
  name: leo-sso-500km
  epoch_utc: "2026-01-01T00:00:00Z"
  seed: 20260101                    # master RNG seed; run is reproducible from {config, seed}
  initial_state:
    orbit:                            # 500 km circular sun-synchronous
      sma_km: 6878.137                # 6378.137 + 500
      ecc: 0.0
      inc_deg: 97.4018                # SSO: nodal precession = 360°/tropical year
      raan_deg: 0.0
      argp_deg: 0.0
      true_anomaly_deg: 0.0
    attitude_quaternion: [1.0, 0.0, 0.0, 0.0]   # scalar-first, body←ECI identity
    body_rate_rad_s: [0.001, -0.002, 0.0015]    # small tumble to exercise attitude
  propagation:
    duration_s: 5677.0                # one orbit period at this altitude
    output_step_s: 10.0
    abs_tol: 1.0e-12
    rel_tol: 1.0e-12
    max_step_s: 60.0
  environment:
    gravity_degree: 8
    drag_enabled: true
    srp_enabled: true
    third_bodies: [sun, moon]     # options: sun, moon, mercury, venus, mars, jupiter, saturn, uranus, neptune
                                  # (case-insensitive; planets are DE440 barycenters, ~1e-7 of the lunar term in LEO)
    atmosphere: exponential
    magnetic_field: igrf
    eclipse_enabled: true
    occultation_atmosphere_km: 100.0  # optical limb height for sensor occlusion (§6.1)
    gnss_jamming_kml: config/scenarios/jamming/eastern_europe.kml  # GNSS loss-of-fix zones (§9.2)
    gnss_jamming_enabled: true        # master switch for the jamming map above
    gnss_noise_enabled: true          # false = truth-perfect GPS (bring-up/debug)
    gnss_fault_events:                # scheduled GNSS faults (§9.2/§23.1.1)
      - {unit: gps_a, type: outage, start_s: 600.0, stop_s: 660.0}
      - {unit: gps_a, type: spoof, start_s: 1200.0, stop_s: 1260.0, spoof_offset_ecef_m: [500.0, 0.0, 0.0]}
  ground_stations:
    - name: svalbard
      lat_deg: 78.23
      lon_deg: 15.39
      alt_m: 450.0
    - name: fairbanks
      lat_deg: 64.86
      lon_deg: -147.85
      alt_m: 130.0
  mc_dispersions:
    - param: spacecraft.mass_kg
      distribution: normal
      sigma: 0.2
    - param: spacecraft.inertia_kgm2.izz
      distribution: normal
      sigma: 0.005
