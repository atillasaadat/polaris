[pytest]
# Polaris Python test configuration.
#
# The Python suite is the analysis / traceability side of the project (design
# doc §22.2): tests under tests/ declare the requirement(s) they verify via the
# @pytest.mark.verifies marker (see tests/conftest.py), which emits the
# sphinx-needs external-needs JSON consumed by the docs RVTM.
#
# Collection is pinned to tests/ so a bare `pytest` never descends into the
# vendored F´ / GoogleTest trees (fprime/, build-*/_deps/) — those ship their
# own Python test scripts that are not ours to run and fail collection here.
testpaths = tests
norecursedirs =
    fprime
    fprime-venv
    docs-venv
    build-*
    build-artifacts
    .git
    .claude
    .claude-flow
    tools/gmat
addopts = -q --strict-markers
markers =
    verifies(*req_ids): requirement ID(s) from the ICD that this test verifies
