# Polaris — Python project & tooling dependencies (design doc §23).
#
# Polaris is a C++ flight-software + simulation project; there is no Python
# package to distribute. This file exists solely to manage the *tooling* Python
# environment reproducibly with `uv` (https://docs.astral.sh/uv):
#
#   uv sync                     # default env: build/test tooling (fprime + dev)
#   uv sync --group docs        # add the documentation toolchain
#   uv run fprime-util build    # run a tool inside the managed env
#
# `uv.lock` pins the full transitive graph for byte-reproducible installs across
# developers and CI. Python is pinned to 3.12 (`.python-version`) — the version
# the vendored F´ v4.2.2 toolchain targets.
[project]
name = "polaris-tooling"
version = "0.0.0"
description = "Polaris spacecraft GNC flight software + 6DOF simulation — Python tooling environment"
requires-python = ">=3.12,<3.13"
# No runtime dependencies: the flight/sim code is C++. All Python deps are
# development tooling, declared as dependency groups below (PEP 735).
dependencies = []

[tool.uv]
# Virtual (non-package) project: install the dependency groups, but do not try
# to build/install Polaris itself as a wheel.
package = false
# Install these groups by default on a bare `uv sync`.
default-groups = ["fprime", "dev", "config"]

[dependency-groups]
# F´ (F Prime) flight-software toolchain. Top-level tools pinned to the versions
# shipped by the vendored submodule (fprime/requirements.txt, tied to F´ v4.2.2);
# uv resolves and locks the transitive graph into uv.lock. `cmake`/`ninja`/`gcovr`
# arrive here as wheels — most of the "build toolchain" is Python-managed.
fprime = [
    "fprime-tools==4.2.1",
    "fprime-gds==4.2.1",
    "fprime-fpp==3.2.0",
    "fprime-fpl-layout==1.0.4",
    "fprime-fpl-write-pic==1.0.4",
    "fprime-visual==1.0.2",
    "cmake==3.26.0",
    "ninja==1.11.1.4",
    "gcovr==8.2",
    # F´ tooling imports the deprecated `pkg_resources` (setuptools) and `pip`
    # directly; uv's minimal venvs ship neither by default (classic venvs do),
    # so pin them explicitly.
    "setuptools==78.1.1",
    "pip>=24",
]

# Documentation site (design doc §21.2). Kept as ranges (majors pinned); uv.lock
# fixes the exact resolved versions. The docs build is a CI gate (sphinx-build -W).
docs = [
    "sphinx>=7.4,<9",
    "pydata-sphinx-theme>=0.16,<0.17",
    "numpydoc>=1.8,<2",
    "breathe>=4.35,<5",
    "sphinxcontrib-bibtex>=2.6,<3",
    "sphinx-needs>=4.1,<5",
    "myst-parser>=4,<5",
    "sphinxcontrib-mermaid>=1,<2",
]

# Local developer tooling: test runner, formatter/linter, and pre-commit driver.
# clang-format is pinned to 18.1.8 to match `.clang-format` (target 18) and the
# pinned pre-commit hook — NOT the 20.1.8 that F´'s aggregate requirements list,
# so manual `clang-format` runs agree with the CI hook.
dev = [
    "pytest==8.3.3",
    "pre-commit>=3.5,<5",
    "ruff==0.8.4",
    "clang-format==18.1.8",
]

# DE440 ephemeris fitting (design doc §11.3, tools/ephem/). Reads a JPL SPK
# kernel and emits the committed Chebyshev fit; ground-side only, never CI.
ephem = [
    "jplephem>=2.21,<3",
    "numpy>=1.26,<3",
]

# IGRF-14 golden generation (design doc §3.7, tools/igrf/). Fetches the IAGA
# coefficient table and drives the pyIGRF14 reference implementation (itself a
# fetch input, never committed); ground-side only, never CI.
igrf = [
    "numpy>=1.26,<3",
]

# Config compiler (design doc §19.3, tools/configc/). The single source-of-truth
# spacecraft/scenario/hardware config is YAML, validated through Pydantic models
# and resolved into F´-param / sim / analysis artifacts. Both already resolve in
# the locked graph (transitive of the toolchain); declared here so the tool's
# runtime deps are explicit rather than borrowed.
config = [
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
]

# Linear control analysis (design doc §8.5, §13; analysis/control/). Classical
# stability margins, controllability and observability of the as-flown
# configuration, computed from the same `config/` YAML the FSW loads — so the
# `config` group above is a prerequisite, not an optional extra (repeated here
# so the group is self-describing; both are default groups anyway).
#
# **No control-systems library.** A loop is a pair of polynomials evaluated with
# numpy, discretised with scipy.signal.cont2discrete; the margin extraction, the
# disk margin and the Gramians are ours, and are validated against closed-form
# cases in tests/analysis/. numpy is pinned at >= 2.0 for `np.trapezoid` (the
# `trapz` spelling it replaced is removed in numpy 2).
#
# NOT a default group: this is a ground-side analysis lane, never CI-critical
# build tooling. It is not optional for the test suite though — the margin
# requirements are verified by the Python suite, so CI runs
# `uv run --group analysis pytest`.
#
# **plotly is the one domain library here**, and only for rendering: the sizing
# report's headline is a 3D momentum envelope a reviewer must rotate to read,
# and hand-rolling an interactive WebGL viewer is far more code than the
# dependency costs. It is emitted with `include_plotlyjs="inline"`, so the
# report is one self-contained file that works offline; nothing is fetched at
# runtime. No analysis number comes from it — it draws what numpy computed.
#
# The page's other rendering library, **KaTeX, is deliberately not here**: it is
# JavaScript, it runs in the reader's browser and never in this process, and it
# is committed verbatim under `analysis/sizing/vendor/katex/` (see that
# directory's PROVENANCE.md) rather than resolved by a package manager, because
# the page inlines the bytes and they must stay reproducible from their upstream
# source. Nothing in this group depends on it and no Python import reaches it.
analysis = [
    "matplotlib>=3.9,<4",
    "plotly>=5.22,<7",
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
]
