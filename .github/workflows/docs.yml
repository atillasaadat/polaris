name: docs

# Build the unified Sphinx site (numpydoc + Breathe/Doxygen + bibtex + sphinx-needs).
# The build is a CI gate: `sphinx-build -W` fails on broken docstrings, missing
# citations, or baselined requirements without a verifying test (design doc §21.2, §22.2).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Set up uv (provisions Python from .python-version)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install docs toolchain
        run: uv sync --only-group docs
      - name: Build docs (warnings are errors)
        run: uv run --only-group docs bash tools/dev/build_docs.sh
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  # Publish to GitHub Pages on main. Gated behind the ENABLE_PAGES repo variable
  # because Pages is unavailable on a private repo under the Free plan (the
  # deploy-pages API returns 422 / "plan does not support Pages"). Turn publishing
  # on once the repo is public *or* the plan supports private Pages:
  #   1. Settings -> Pages -> Build and deployment -> Source: GitHub Actions
  #   2. Settings -> Secrets and variables -> Actions -> Variables:
  #        ENABLE_PAGES = true
  # Until then this job is skipped (not failed), so main stays green. The `build`
  # job above still validates the docs under -W and uploads the site artifact.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
