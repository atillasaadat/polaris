name: ci

# Polaris CI pipeline (design doc §23.2). The lint gate is active now; the build
# and test stages are stubbed and activate as code lands in later Phase-0 pushes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-commit (format + quick lint)
        run: |
          python -m pip install --upgrade pip pre-commit
          pre-commit run --all-files --show-diff-on-failure

  # Build the F´ flight-software baseline (F´ core + PolarisFsw deployment) and run
  # the lib unit suite. Warnings-as-errors on Polaris targets (polaris_flags).
  build:
    name: build + unit tests (F´)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # fprime + its nested submodules
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Install F´ toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build (F´ core + PolarisFsw deployment)
        run: |
          fprime-util generate
          fprime-util build
      - name: Build + run lib unit tests (GoogleTest via ctest)
        run: |
          cmake --build build-fprime-automatic-native --target polaris_unit_tests
          ctest --test-dir build-fprime-automatic-native --output-on-failure

  # ── Remaining §23.2 stages — each activates when its code exists ─────────────
  #   static-analysis:  clang-tidy, cppcheck, ASan/UBSan test builds   (Push 2)
  #   integration-sitl: two-process closed-loop SITL scenarios         (Push 4+)
  #   mc-smoke:         Monte Carlo smoke subset                       (Push 11)
  #   golden:           GMAT golden-fixture regression                 (Push 5)
  #   coverage:         line + branch thresholds                       (Push 6)
