name: ci

# Polaris CI pipeline (design doc §23.2). Active per-PR lanes: lint (pre-commit),
# the F´ build + the C++ suites (unit under ASan/UBSan, component, integration,
# golden), and the Python tooling suite. The GMAT fixture drift check lives out of
# this path in golden.yml (weekly); the docs `-W` gate lives in docs.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv (provisions Python from .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run pre-commit (format + quick lint)
        run: uv run --only-group dev pre-commit run --all-files --show-diff-on-failure

  # Build the F´ flight-software baseline (F´ core + PolarisFsw deployment) and run
  # the lib unit suite. Warnings-as-errors on Polaris targets (polaris_flags).
  build:
    name: build + unit tests (F´)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # fprime + its nested submodules
      - name: Set up uv (provisions Python from .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install F´ toolchain (cmake + ninja arrive as wheels)
        run: uv sync                     # default groups: fprime + dev
      - name: Install gfortran (NRLMSIS 2.1 is Fortran; see THIRD_PARTY_NOTICES.md)
        run: sudo apt-get update && sudo apt-get install -y gfortran
      # map.nrl.navy.mil has real outages; without this cache every build is
      # hostage to it at CMake configure time. The tarball is cached keyed on
      # its SHA256 (the same hash cmake/Dependencies.cmake verifies), fetched
      # with retries only on a cold cache, and handed to CMake via
      # POLARIS_NRLMSIS_TARBALL. Cached artifact only — never committed (see
      # the license note in cmake/Dependencies.cmake).
      - name: Cache NRLMSIS 2.1 tarball
        id: nrlmsis-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/polaris/nrlmsis2.1.tar.gz
          key: nrlmsis-41e47b29f795d36a5cc252b2858aa2a384c4a7323ace3d48d3ea2f2b37a1a6a8
      - name: Download NRLMSIS 2.1 (cold cache only)
        if: steps.nrlmsis-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/polaris
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 30 \
            --connect-timeout 60 \
            -o ~/.cache/polaris/nrlmsis2.1.tar.gz \
            https://map.nrl.navy.mil/map/pub/nrl/NRLMSIS/NRLMSIS2.1/nrlmsis2.1.tar.gz
      - name: Point CMake at the cached tarball
        run: echo "POLARIS_NRLMSIS_TARBALL=$HOME/.cache/polaris/nrlmsis2.1.tar.gz" >> "$GITHUB_ENV"
      - name: Build (F´ core + PolarisFsw deployment)
        run: |
          uv run fprime-util generate
          uv run fprime-util build
      - name: Build + run lib unit tests (GoogleTest via ctest)
        run: |
          uv run fprime-util generate --ut
          uv run fprime-util build --ut
          uv run fprime-util check

  # The Python tooling suite: config compiler + PrmDb emitter, GMAT harness, space
  # weather, orbit. `tools/` is pure Python, so this lane needs no compile step and no
  # submodules — `uv run` provisions the default groups (fprime + dev + config) from
  # uv.lock and runs. GMAT-dependent cases skip themselves when GMAT is absent (it is
  # a ~300 MB desktop install, deliberately confined to golden.yml).
  python-tests:
    name: python tests (tools/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv (provisions Python from .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run pytest
        run: uv run --frozen pytest   # fail if uv.lock is stale rather than silently re-resolving

  # ── Remaining §23.2 stages — not yet wired ───────────────────────────────────
  #   static-analysis:  clang-tidy + cppcheck as their own lane (.clang-tidy exists;
  #                     ASan/UBSan already run via the `build` job's unit suite)
  #   mc-smoke:         Monte Carlo smoke subset — waits on the §13 framework (Phase 11)
  #   coverage:         line + branch thresholds (§22.2)
