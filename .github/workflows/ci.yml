name: ci

# Polaris CI pipeline (design doc §23.2). Active per-PR lanes: lint (pre-commit),
# the F´ build + the C++ suites (unit under ASan/UBSan, component, integration,
# golden), and the Python tooling suite. The GMAT fixture drift check lives out of
# this path in golden.yml (weekly); the docs `-W` gate lives in docs.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv (provisions Python from .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run pre-commit (format + quick lint)
        run: uv run --only-group dev pre-commit run --all-files --show-diff-on-failure

  # Build the F´ flight-software baseline (F´ core + PolarisFsw deployment) and run
  # the lib unit suite. Warnings-as-errors on Polaris targets (polaris_flags).
  build:
    name: build + unit tests (F´)
    runs-on: ubuntu-latest
    env:
      # ccache in front of every compiler (C, C++, and gfortran for NRLMSIS).
      # CMake reads these environment variables at configure time and stamps
      # them into the build; the cache itself persists across runs via
      # actions/cache below. ~1300 targets rebuild from scratch without this,
      # and between pushes almost none of them changed.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_Fortran_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # fprime + its nested submodules
      - name: Set up uv (provisions Python from .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install F´ toolchain (cmake + ninja arrive as wheels)
        run: uv sync                     # default groups: fprime + dev
      - name: Install gfortran (NRLMSIS 2.1 is Fortran; see THIRD_PARTY_NOTICES.md) + ccache
        run: sudo apt-get update && sudo apt-get install -y gfortran ccache
      # The compiler cache is what makes a warm CI build fast (~90 %+ hit rate on
      # a typical push: F´ core and most of Polaris are unchanged). Keyed per
      # run so the updated cache is always saved; restored from the most recent
      # prior run via the prefix.
      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-
      # map.nrl.navy.mil has real outages; without this cache every build is
      # hostage to it at CMake configure time. The tarball is cached keyed on
      # its SHA256 (the same hash cmake/Dependencies.cmake verifies), fetched
      # with retries only on a cold cache, and handed to CMake via
      # POLARIS_NRLMSIS_TARBALL. Cached artifact only — never committed (see
      # the license note in cmake/Dependencies.cmake).
      - name: Cache NRLMSIS 2.1 tarball
        id: nrlmsis-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/polaris/nrlmsis2.1.tar.gz
          key: nrlmsis-41e47b29f795d36a5cc252b2858aa2a384c4a7323ace3d48d3ea2f2b37a1a6a8
      - name: Download NRLMSIS 2.1 (cold cache only)
        if: steps.nrlmsis-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/polaris
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 30 \
            --connect-timeout 60 \
            -o ~/.cache/polaris/nrlmsis2.1.tar.gz \
            https://map.nrl.navy.mil/map/pub/nrl/NRLMSIS/NRLMSIS2.1/nrlmsis2.1.tar.gz
      - name: Point CMake at the cached tarball
        run: echo "POLARIS_NRLMSIS_TARBALL=$HOME/.cache/polaris/nrlmsis2.1.tar.gz" >> "$GITHUB_ENV"
      - name: Build (F´ core + PolarisFsw deployment)
        run: |
          uv run fprime-util generate
          uv run fprime-util build
      # -O2 on the UT tree, keeping the Debug build type so asserts stay live
      # (Debug's own -g appends after, and no NDEBUG is defined). F´'s UT default
      # is a plain -O0 Debug build, which is the right thing for debugging a test
      # and the wrong thing for running 712 of them: the sim side of every SITL
      # row is Eigen-heavy, and unoptimized Eigen measured 34x slower per sensor
      # sample (7.43 -> 0.22 us, identical output). This flag is most of the
      # difference between the momentum rows fitting their timeout comfortably
      # and being killed by it. Locally, drop back to -O0 (omit the flag) when
      # single-stepping a test matters more than its runtime.
      - name: Build unit-test tree (GoogleTest)
        run: |
          uv run fprime-util generate --ut -DCMAKE_CXX_FLAGS=-O2 -DCMAKE_Fortran_FLAGS=-O2
          uv run fprime-util build --ut
      # Direct ctest instead of `fprime-util check`, for the -j: check runs the
      # suite serially, which is the difference between the sum of all 684 tests
      # (~74 min on this runner) and roughly the longest single SITL row. The
      # suite is parallel-safe — the local recipe has always been `ctest -j8`
      # (PROGRESS.md § Build & verify locally).
      - name: Run test suites (ctest, parallel)
        run: |
          uv run ctest --test-dir build-fprime-automatic-native-ut \
            -j "$(nproc)" --output-on-failure --no-tests=error
      - name: ccache statistics (hit rate this run)
        if: always()
        run: ccache -s

  # The Python suite: config compiler + PrmDb emitter, GMAT harness, space weather,
  # orbit, and the analysis/control linear-analysis package (REQ-ACTL-006/007/008).
  # Both trees are pure Python, so this lane needs no compile step and no submodules —
  # `uv run` provisions the default groups (fprime + dev + config) from uv.lock, plus
  # `analysis` for numpy/scipy/matplotlib, and runs. The analysis group is not a
  # default group (it is a ground-side lane, not build tooling) but it is not optional
  # here: without it the tests/analysis/ cases fail to import rather than skipping.
  # GMAT-dependent cases skip themselves when GMAT is absent (it is a ~300 MB desktop
  # install, deliberately confined to golden.yml).
  python-tests:
    name: python tests (tools/ + analysis/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv (provisions Python from .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run pytest
        # --frozen: fail if uv.lock is stale rather than silently re-resolving
        run: uv run --frozen --group analysis pytest

  # FreeFlyer cross-validation (REQ-VV-006). Dormant until the repository
  # variable FREEFLYER_CI_ENABLED is set to 'true' AND the secrets exist:
  # the single node-locked license currently lives on the development machine,
  # and a.i. solutions must bless ephemeral-runner activation (the key's
  # device-transfer allowance is finite — see tools/freeflyer/README.md)
  # before CI may hold a seat. The job body is the same no-root recipe the
  # dev machine runs: bsdtar-extract the el9 RPM, stage the ICU/GL sonames
  # Ubuntu lacks, activate, test, and ALWAYS deactivate so the seat returns.
  freeflyer-vv:
    name: FreeFlyer cross-validation (V&V)
    runs-on: ubuntu-latest
    if: ${{ vars.FREEFLYER_CI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv (provisions Python from .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Cache the FreeFlyer RPM + runtime sonames
        id: ff-cache
        uses: actions/cache@v4
        with:
          path: ~/freeflyer-pkg
          key: freeflyer-7.10.1.60799527-el9-deps-v1
      - name: Fetch the FreeFlyer RPM (cold cache)
        if: steps.ff-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/freeflyer-pkg
          curl -fsSL --retry 3 -o ~/freeflyer-pkg/freeflyer.rpm "${{ secrets.FREEFLYER_RPM_URL }}"
          for pkg in \
            "http://ftp.debian.org/debian/pool/main/i/icu/libicu67_67.1-7_amd64.deb" \
            "http://archive.ubuntu.com/ubuntu/pool/universe/libg/libglu/libglu1-mesa_9.0.2-1.1build1_amd64.deb" \
            "http://archive.ubuntu.com/ubuntu/pool/main/libg/libglvnd/libopengl0_1.7.0-1build1_amd64.deb"; do
            curl -fsSL --retry 3 -O --output-dir ~/freeflyer-pkg "$pkg"
          done
      - name: Extract FreeFlyer + dependencies (no root, bsdtar)
        run: |
          mkdir -p ~/freeflyer-7.10.1/deps
          bsdtar -xf ~/freeflyer-pkg/freeflyer.rpm -C ~/freeflyer-7.10.1
          for deb in ~/freeflyer-pkg/*.deb; do
            bsdtar -xOf "$deb" data.tar.xz > /tmp/data.tar 2>/dev/null || \
              bsdtar -xOf "$deb" data.tar.zst | zstd -d > /tmp/data.tar
            bsdtar -xf /tmp/data.tar -C ~/freeflyer-7.10.1/deps
          done
      - name: Activate the FreeFlyer license
        run: |
          FF_DIR=$(echo ~/freeflyer-7.10.1/usr/share/a.i.*/FreeFlyer*)
          export LD_LIBRARY_PATH="$HOME/freeflyer-7.10.1/deps/usr/lib/x86_64-linux-gnu:$FF_DIR"
          cd "$FF_DIR" && ./ff -al "${{ secrets.FREEFLYER_LICENSE_KEY }}" && ./ff -rli
      - name: Run the cross-validation suite
        run: uv run --frozen --group analysis pytest tests/freeflyer -v
      - name: Deactivate the license (return the seat)
        if: always()
        run: |
          FF_DIR=$(echo ~/freeflyer-7.10.1/usr/share/a.i.*/FreeFlyer*)
          export LD_LIBRARY_PATH="$HOME/freeflyer-7.10.1/deps/usr/lib/x86_64-linux-gnu:$FF_DIR"
          cd "$FF_DIR" && ./ff -dal || true

  # ── Remaining §23.2 stages — not yet wired ───────────────────────────────────
  #   static-analysis:  clang-tidy + cppcheck as their own lane (.clang-tidy exists;
  #                     ASan/UBSan already run via the `build` job's unit suite)
  #   mc-smoke:         Monte Carlo smoke subset — waits on the §13 framework (Phase 11)
  #   coverage:         line + branch thresholds (§22.2)
