# Pre-commit hooks for Polaris (design doc §23.3 — format + quick lint).
# Install once:  pip install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Committed external files in their native upstream format are kept
      # byte-stable so each stays reproducible from its source: the reference
      # data (IERS finals, the EGM2008 .gfc degree-window, the space-weather
      # table) and the vendored KaTeX build the sizing report inlines
      # (analysis/sizing/vendor/katex/PROVENANCE.md records where each came
      # from). Normalizing whitespace in a minified bundle would fork it from
      # the published artifact, which is the one thing vendoring must not do.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '^(LICENSE|(tests/golden/(finals\.all\.iau2000\.txt|EGM2008_to200\.gfc|SW-All\.csv)|analysis/sizing/vendor/.*))$'
      - id: end-of-file-fixer
        exclude: '^(LICENSE|(tests/golden/(finals\.all\.iau2000\.txt|EGM2008_to200\.gfc|SW-All\.csv)|analysis/sizing/vendor/.*))$'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]
        # Static reference data, not source (REQ-CONV-002 / REQ-SIM-002).
        exclude: '^(tests/golden/(finals\.all\.iau2000\.txt|EGM2008_to200\.gfc|SW-All\.csv)|analysis/sizing/vendor/.*)$'
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '^(tests/golden/(finals\.all\.iau2000\.txt|EGM2008_to200\.gfc|SW-All\.csv)|analysis/sizing/vendor/.*)$'

  # C++ formatting — pinned clang-format wheel (matches .clang-format, target 18).
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]

  # Python lint + format for analysis/, bindings/, tools/, mc/.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # FreeFlyer cross-validation (REQ-VV-006), pre-push only: runs the V&V suite
  # against a locally installed, licensed FreeFlyer when one is discoverable
  # and skips visibly when none is (tests/freeflyer/conftest.py owns the
  # skip). The full matrix costs ~2 s of engine time on a warm machine.
  - repo: local
    hooks:
      - id: freeflyer-vv
        name: FreeFlyer V&V cross-check
        entry: uv run --frozen --group analysis pytest tests/freeflyer -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
